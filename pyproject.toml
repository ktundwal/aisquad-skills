[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisquad-skills"
version = "0.1.0"
description = "Battle-tested agent prompts for AI development teams"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "agents", "prompts", "skills", "llm"]
authors = [
    { name = "Kapil Tundwal" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Documentation = "https://github.com/ktundwal/aisquad-skills#readme"
Issues = "https://github.com/ktundwal/aisquad-skills/issues"
Source = "https://github.com/ktundwal/aisquad-skills"

[tool.hatch.build.targets.wheel]
packages = ["squad_skills"]

[tool.hatch.build.targets.sdist]
include = [
    "/squad_skills",
]
