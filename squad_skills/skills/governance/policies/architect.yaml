# Architect Agent Policy
# Designs system architecture and technical specifications

agent_name: architect
description: Designs system architecture and technical specifications

# Cost governance
max_cost_usd: 20.0
max_tokens_per_request: 100000
max_requests_per_minute: 30

# Time governance
max_task_duration_seconds: 1200  # 20 minutes
max_stage_duration_seconds: 600   # 10 minutes

# Behavioral governance
max_retries_per_action: 3
circuit_breaker_threshold: 5
max_stage_visits: 3

# Container config (for future containerization)
filesystem:
  read_paths:
    - "**/*"
  write_paths:
    - "docs/design/**"
    - "docs/architecture/**"
  deny_paths:
    - ".env"
    - "**/.env"
    - "**/secrets/**"

network:
  allow_network: false
  allowed_hosts: []
  allowed_ports: []

# Allowed tools
tools:
  - Read
  - Glob
  - Grep

# Escalation
escalation_contacts:
  - human_reviewer
  - tech_lead

auto_escalate_on:
  - budget_warning
  - loop_detected
  - security_concern
