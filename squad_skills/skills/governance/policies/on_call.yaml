# On-Call Agent Policy
# Validates operational readiness (5-min detect, 25-min resolve)

agent_name: on_call
description: Validates operational readiness with 5-25 rule (5 min detect, 25 min resolve)

# Cost governance
max_cost_usd: 15.0
max_tokens_per_request: 100000
max_requests_per_minute: 30

# Time governance
max_task_duration_seconds: 1200  # 20 minutes
max_stage_duration_seconds: 600  # 10 minutes

# Behavioral governance
max_retries_per_action: 3
circuit_breaker_threshold: 5
max_stage_visits: 3

# Container config - needs access to monitoring tools
filesystem:
  read_paths:
    - "**/*"
  write_paths:
    - "docs/runbooks/**"
    - "monitoring/**"
    - "scripts/ops/**"
  deny_paths:
    - ".env"
    - "**/.env"
    - "**/secrets/**"
    - "**/*.pem"
    - "**/*.key"

network:
  allow_network: true
  allowed_hosts:
    - localhost
    - "127.0.0.1"
  allowed_ports:
    - 9090   # Prometheus
    - 3000   # Grafana
    - 9093   # Alertmanager
    - 8080   # Common app port

# Allowed tools
tools:
  - Read
  - Write
  - Glob
  - Grep
  - "Bash(docker*)"
  - "Bash(kubectl*)"
  - "Bash(curl localhost*)"
  - "Bash(curl 127.0.0.1*)"

# Escalation
escalation_contacts:
  - human_reviewer
  - sre_team
  - platform_team

auto_escalate_on:
  - budget_warning
  - missing_observability
  - no_runbook
  - slo_violation_risk
